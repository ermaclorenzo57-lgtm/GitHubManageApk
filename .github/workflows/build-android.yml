# Reusable Android build. Works for this repo and, via `uses:`, for any other repo:
#   jobs:
#     build:
#       uses: <owner>/LomipeDevHub/.github/workflows/build-android.yml@main
# It finds the Gradle project (or the newest project ZIP) by itself, so uploading a new version
# never requires editing this file.
name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: Gradle task to run
        default: assembleDebug
        type: string
      project_dir:
        description: Folder containing gradlew (blank = auto-detect)
        default: ""
        type: string
      run_tests:
        description: Run unit tests before building
        default: true
        type: boolean
  workflow_call:
    inputs:
      task: { type: string, default: assembleDebug }
      project_dir: { type: string, default: "" }
      run_tests: { type: boolean, default: true }
      # Set to "<owner>/LomipeDevHub" when calling from ANOTHER repository (needs tools/locate_project.py).
      tools_repo: { type: string, default: "" }
    secrets:
      LOMIPE_KEYSTORE_BASE64: { required: false }
      LOMIPE_KEYSTORE_PASSWORD: { required: false }
      LOMIPE_KEY_ALIAS: { required: false }
      LOMIPE_KEY_PASSWORD: { required: false }

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TASK: ${{ inputs.task || 'assembleDebug' }}
      RUN_TESTS: ${{ (github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_tests != false) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch locator script (only when called from another repo)
        if: ${{ inputs.tools_repo != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tools_repo }}
          path: .lomipe_tools

      - name: Locate Android project
        id: locate
        env:
          PROJECT_DIR: ${{ inputs.project_dir || vars.LOMIPE_PROJECT_DIR || '' }}
        run: |
          SCRIPT=tools/locate_project.py
          [ -f "$SCRIPT" ] || SCRIPT=.lomipe_tools/tools/locate_project.py
          python3 "$SCRIPT" --project-dir "$PROJECT_DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare beta candidate (Dev Hub only)
        if: ${{ github.repository == 'ermaclorenzo57-lgtm/GitHubManageApk' && inputs.tools_repo == '' }}
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          python3 tools/prepare_public_beta.py "$PROJECT_DIR"
          echo "LOMIPE_VERSION_CODE=10000" >> "$GITHUB_ENV"
          echo "LOMIPE_VERSION_NAME=1.0.0" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Maven/Gradle servers sometimes answer "429 Too Many Requests" to shared runners.
      # Retrying with a growing pause usually gets past it.
      - name: Unit tests
        if: env.RUN_TESTS == 'true'
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew --no-daemon testDebugUnitTest && exit 0
            echo "Attempt $i failed, waiting before retry"; sleep $((i*60))
          done
          exit 1

      - name: Reject production signing in general CI
        if: env.TASK == 'assembleRelease' && github.repository == 'ermaclorenzo57-lgtm/GitHubManageApk'
        run: |
          echo 'Use the protected MaxRepo production signing workflow.'
          exit 1

      - name: Configure release signing (manual main only)
        if: env.TASK == 'assembleRelease'
        env:
          KS_B64: ${{ secrets.LOMIPE_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.LOMIPE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.LOMIPE_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.LOMIPE_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Release signing requires a manual main-branch build"
            exit 1
          fi
          if [[ -z "$KS_B64" || -z "$KS_PASSWORD" || -z "$KS_ALIAS" || -z "$KS_KEY_PASSWORD" ]]; then
            echo "::error::Release signing credentials are missing"
            exit 1
          fi
          umask 077
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          for value in "$KS_PASSWORD" "$KS_ALIAS" "$KS_KEY_PASSWORD"; do
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then exit 1; fi
          done
          {
            printf 'LOMIPE_KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'LOMIPE_KEYSTORE_PASSWORD=%s\n' "$KS_PASSWORD"
            printf 'LOMIPE_KEY_ALIAS=%s\n' "$KS_ALIAS"
            printf 'LOMIPE_KEY_PASSWORD=%s\n' "$KS_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew --no-daemon "$TASK" && exit 0
            echo "Attempt $i failed, waiting before retry"; sleep $((i*60))
          done
          exit 1

      - name: Collect APKs and checksums
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          mkdir -p dist
          if [[ "$TASK" == assembleRelease ]]; then
            find "$PROJECT_DIR" -path '*/build/outputs/apk/release/*' -name '*.apk' -exec cp {} dist/ \;
          else
            find "$PROJECT_DIR" -path '*/build/outputs/apk/*' -name '*.apk' -exec cp {} dist/ \;
          fi
          if ! ls dist/*.apk >/dev/null 2>&1; then echo "::error::No APK was produced by task $TASK"; exit 1; fi
          (cd dist && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)

      - name: Verify release APK signatures
        if: env.TASK == 'assembleRelease'
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$signer"
          for apk in dist/*.apk; do "$signer" verify --verbose --print-certs "$apk"; done

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
