name: Android emulator tests
on:
  pull_request:
    paths: ['tools/**', '.github/workflows/android-device-test.yml', '*.zip']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    env:
      LOMIPE_VERSION_CODE: 10000
      LOMIPE_VERSION_NAME: 1.0.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Locate and patch project
        id: locate
        run: python3 tools/locate_project.py
      - name: Apply beta overlay
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: python3 tools/prepare_public_beta.py "$PROJECT_DIR"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: cd "$PROJECT_DIR" && chmod +x gradlew && ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-results-api-${{ matrix.api }}
          path: '**/build/outputs/androidTest-results/**'
          if-no-files-found: ignore
